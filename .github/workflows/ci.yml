name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  api-e2e:
    name: API e2e (PostgreSQL + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kanban
          POSTGRES_PASSWORD: kanban
          POSTGRES_DB: kanban
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kanban -d kanban"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://kanban:kanban@localhost:5432/kanban?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kanban/shared build
      - run: pnpm --filter @kanban/api test:e2e

  e2e:
    name: Playwright E2E (2 browsers)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kanban
          POSTGRES_PASSWORD: kanban
          POSTGRES_DB: kanban
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kanban -d kanban"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://kanban:kanban@localhost:5432/kanban?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-secret
      WEB_ORIGIN: http://localhost:3000
      E2E_START_SERVER: '1'
      MULTI_SERVER_URLS: http://localhost:3000,http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @kanban/api prisma:deploy
      - run: pnpm --filter @kanban/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @kanban/e2e test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  deploy:
    name: Deploy to Fly.io
    # main 병합 시, 모든 검증이 통과하고 FLY_API_TOKEN 시크릿이 설정된 경우에만 배포
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, api-e2e, e2e]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip when FLY_API_TOKEN is not configured
        if: env.FLY_API_TOKEN == ''
        run: echo "::notice::FLY_API_TOKEN 시크릿이 없어 배포를 건너뜁니다 (docs/deployment.md 참고)"
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: env.FLY_API_TOKEN != ''
      - name: flyctl deploy
        if: env.FLY_API_TOKEN != ''
        run: flyctl deploy --remote-only --build-arg GIT_SHA=${{ github.sha }}
