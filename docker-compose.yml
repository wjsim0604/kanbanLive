# 기본: 인프라(PostgreSQL, Redis)만 실행 → docker compose up -d
# 전체:  앱까지 컨테이너로 실행        → docker compose --profile app up --build  (http://localhost:3000)
# 확장:  api 2대 + Nginx              → docker compose -f docker-compose.yml -f docker-compose.scale.yml --profile scale up --build  (http://localhost:8080)
name: kanban-live

x-app-env: &app-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-kanban}:${POSTGRES_PASSWORD:-kanban}@postgres:5432/${POSTGRES_DB:-kanban}?schema=public
  REDIS_URL: redis://redis:6379
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local-compose-secret}
  WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kanban}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kanban}
      POSTGRES_DB: ${POSTGRES_DB:-kanban}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-kanban} -d ${POSTGRES_DB:-kanban}']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # 스키마 마이그레이션 (한 번 실행 후 종료)
  migrate:
    profiles: [app, scale]
    build: .
    image: kanban-live
    command: ['node', 'node_modules/prisma/build/index.js', 'migrate', 'deploy']
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy

  app:
    profiles: [app]
    image: kanban-live
    build: .
    environment: *app-env
    ports:
      - '3000:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
